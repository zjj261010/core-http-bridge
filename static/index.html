<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE HTTP Bridge - 管理控制台</title>
<style>
:root {
  --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
  --fg: #e2e8f0; --fg2: #94a3b8; --accent: #3b82f6;
  --accent2: #60a5fa; --green: #22c55e; --red: #ef4444;
  --yellow: #eab308; --orange: #f97316;
  --radius: 8px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Layout ── */
.app { display: flex; height: 100vh; }
.sidebar { width: 320px; min-width: 320px; background: var(--bg2); border-right: 1px solid var(--bg3); display: flex; flex-direction: column; overflow: hidden; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── Header ── */
.header { padding: 16px 20px; background: var(--bg2); border-bottom: 1px solid var(--bg3); display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 600; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.badge-green { background: rgba(34,197,94,0.2); color: var(--green); }
.badge-yellow { background: rgba(234,179,8,0.2); color: var(--yellow); }
.badge-red { background: rgba(239,68,68,0.2); color: var(--red); }
.badge-gray { background: rgba(148,163,184,0.2); color: var(--fg2); }

/* ── Sidebar sections ── */
.sidebar-section { padding: 16px 20px; border-bottom: 1px solid var(--bg3); }
.section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--fg2); margin-bottom: 12px; letter-spacing: 0.5px; }

.session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 10px 12px; border-radius: var(--radius); cursor: pointer; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
.session-item:hover { background: var(--bg3); }
.session-item.active { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); }
.session-item .name { font-size: 14px; font-weight: 500; }
.session-item .meta { font-size: 11px; color: var(--fg2); margin-top: 2px; }

/* ── Topology canvas ── */
.canvas-area { flex: 1; position: relative; overflow: hidden; background: radial-gradient(ellipse at center, #1a2332 0%, #0f172a 100%); }
.canvas-area svg { width: 100%; height: 100%; }
.node-box { z-index: 2; position: absolute; width: 120px; height: 80px; background: var(--bg2); border: 2px solid var(--bg3); border-radius: var(--radius); cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); transition: border-color 0.2s; user-select: none; pointer-events: auto; }
.node-box:hover { border-color: var(--accent); }
.node-box.selected { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(59,130,246,0.3); }
.node-box .icon { font-size: 24px; margin-bottom: 4px; }
.node-box .label { font-size: 11px; color: var(--fg2); }
.node-box .ip { font-size: 10px; color: var(--fg2); margin-top: 2px; }
.link-line { stroke: var(--fg2); stroke-width: 2; fill: none; pointer-events: none; }
.link-line:hover { stroke: var(--accent2); stroke-width: 3; }
.link-line.selected { stroke: var(--accent2); stroke-width: 3; box-shadow: none; }
/* 透明粗 hit 线承载点击, 命中带 ±7px, 解决细线难选中 */
/* ★ pointer-events:all 必须——父 svg 是 pointer-events:none, 不覆盖则点击热区继承失效 */
.link-hit { stroke: transparent; stroke-width: 16; fill: none; stroke-linecap: round; cursor: pointer; pointer-events: all; }
#linksSvg text { pointer-events: all; cursor: pointer; }

/* ── Tab4 画布扩展: 缩放平移 world 层 ── */
#world { position: absolute; inset: 0; transform-origin: 0 0; }
#canvas.panning { cursor: grabbing; }
#canvas.linking .node-box { cursor: crosshair; }
#canvas.linking .node-box:hover { border-color: var(--accent2); }
.node-box.link-src { border-color: var(--ok) !important; box-shadow: 0 0 0 3px rgba(34,197,94,.35); }
.link-preview { stroke: var(--ok); stroke-width: 2; stroke-dasharray: 6 4; fill: none; pointer-events: none; }
.zoom-label { color: var(--fg2); font-size: 11px; margin-left: 4px; }
.canvas-tools { position: absolute; top: 12px; right: 12px; z-index: 6; display: flex; gap: 6px; align-items: center; background: rgba(30,41,59,.92); padding: 6px 8px; border-radius: var(--radius); border: 1px solid var(--bg3); }
.freeze-chip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6; background: rgba(59,47,5,.95); color: var(--warn); border: 1px solid #713f12; padding: 5px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; }
/* ── Tab4 实例库面板（拖拽建节点）── */
.instance-lib { position: absolute; left: 12px; top: 12px; z-index: 5; width: 224px; max-height: 62%; overflow: auto; background: rgba(30,41,59,.95); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 8px; }
.instance-lib .il-title { font-size: 12px; color: var(--fg2); margin-bottom: 6px; font-weight: 600; }
.instance-lib .il-item { padding: 7px 9px; border: 1px solid var(--bg3); border-radius: 6px; margin-bottom: 5px; cursor: grab; font-size: 12.5px; background: var(--bg); }
.instance-lib .il-item:hover { border-color: var(--accent); }
.instance-lib .il-item .rt { font-size: 10px; color: var(--fg2); margin-top: 2px; }
.instance-lib .il-item.dragging-item { opacity: .5; }
.instance-lib.frozen { opacity: .45; pointer-events: none; }
.instance-lib .il-empty { color: var(--fg2); font-size: 12px; padding: 6px; }
.instance-lib .il-group { font-size: 11px; color: var(--fg2); margin: 8px 0 4px; cursor: pointer; user-select: none; }
.instance-lib .il-group:hover { color: var(--fg); }
.instance-lib .il-fav { float: right; cursor: pointer; opacity: .45; }
.instance-lib .il-fav.on { opacity: 1; }

/* ── 5-Tab 左侧导航壳（设计 §2.1: 同一单页内路由切换, 无多页跳转）── */
.side-nav { padding: 6px 8px; border-bottom: 1px solid var(--bg3); }
.side-nav .sn-title { font-size: 11px; color: var(--fg2); padding: 6px 8px; font-weight: 600; letter-spacing: .5px; }
.side-tab { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; font-size: 13.5px; color: var(--fg2); margin-bottom: 2px; }
.side-tab:hover { background: var(--bg3); color: var(--fg); }
.side-tab.on { background: rgba(59,130,246,0.15); color: var(--fg); border: 1px solid rgba(59,130,246,0.3); }
#tabFrame { display: none; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 20; background: var(--bg); }
#linksSvg .link-hit:hover + .link-line { stroke: var(--accent2); stroke-width: 3; }

/* ── Bottom panel ── */
.bottom-panel { height: 220px; min-height: 220px; background: var(--bg2); border-top: 1px solid var(--bg3); display: flex; flex-direction: column; }
.panel-tabs { display: flex; background: var(--bg3); }
.panel-tab { padding: 8px 16px; font-size: 12px; cursor: pointer; border: none; background: transparent; color: var(--fg2); font-weight: 500; border-bottom: 2px solid transparent; }
.panel-tab:hover { color: var(--fg); }
.panel-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); background: rgba(59,130,246,0.08); }
.panel-content { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 13px; font-family: 'Consolas', 'Courier New', monospace; white-space: pre-wrap; }
.panel-content .log-entry { padding: 2px 0; }
.panel-content .log-time { color: var(--fg2); }
.panel-content .log-info { color: var(--accent2); }
.panel-content .log-ok { color: var(--green); }
.panel-content .log-err { color: var(--red); }

/* ── Modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--bg2); border-radius: 12px; width: 640px; max-width: 90vw; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--bg3); display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 16px; font-weight: 600; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--bg3); display: flex; justify-content: flex-end; gap: 8px; }

/* ── Buttons / Form ── */
.btn { padding: 8px 16px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary { background: var(--bg3); color: var(--fg); }
.btn-secondary:hover { background: #475569; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: none; cursor: pointer; background: var(--bg3); color: var(--fg2); }
.btn-icon:hover { background: var(--bg3); color: var(--fg); }

input, textarea, select { background: var(--bg3); border: 1px solid var(--bg3); color: var(--fg); padding: 8px 12px; border-radius: var(--radius); font-size: 13px; width: 100%; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { font-family: 'Consolas', 'Courier New', monospace; resize: vertical; }
label { display: block; font-size: 12px; font-weight: 500; color: var(--fg2); margin-bottom: 4px; }
.form-group { margin-bottom: 12px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-inline { display: flex; gap: 8px; align-items: center; }
.form-inline input { width: auto; flex: 1; }

/* ── Empty state ── */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--fg2); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state p { font-size: 14px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* ── Drag helper ── */
.dragging { opacity: 0.7; cursor: grabbing !important; }

.context-menu { position:fixed; z-index:200; background:var(--bg2); border:1px solid var(--bg3); border-radius:var(--radius); box-shadow:0 8px 32px rgba(0,0,0,0.4); min-width:160px; padding:4px 0; display:none; }
.context-menu-item { padding:8px 16px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
.context-menu-item:hover { background:rgba(59,130,246,0.15); color:var(--accent2); }
.context-menu-item.danger:hover { background:rgba(239,68,68,0.15); color:var(--red); }
.context-menu-divider { height:1px; background:var(--bg3); margin:4px 0; }
.prop-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.prop-grid .full { grid-column:1/-1; }
.prop-label { font-size:11px; color:var(--fg2); margin-bottom:2px; }
.prop-value { font-size:13px; padding:4px 8px; background:var(--bg); border-radius:4px; border:1px solid var(--bg3); }

.term-header .close-btn { cursor:pointer; padding:2px 8px; }
.term-header .close-btn:hover { background:var(--red); color:#fff; border-radius:4px; }
.term-input-bar input { flex:1; background:#111; color:#0f0; border:none; padding:6px 8px; border-radius:4px; font-family:monospace; }
.term-input-bar input:focus { box-shadow:0 0 0 1px var(--accent); outline:none; }
.term-conn-btn { padding:4px 12px; border-radius:4px; border:none; cursor:pointer; font-size:12px; background:var(--accent); color:#fff; white-space:nowrap; }
.term-conn-btn:hover { background:#2563eb; }
.term-status { font-size:11px; color:var(--fg2); white-space:nowrap; }
</style>

<script>
const API = '';
let state = {
  sessions: [],
  currentSid: null,
  sessionState: null,          // 当前会话状态(数字): 1=已定义 2=配置 3=实例化 4=运行 5=收数 6=停止
  nodes: {},
  links: [],
  selectedNode: null,
  selectedLink: null,
  dragging: null,
  dragOffset: {x:0, y:0},
  eventSource: null,
  log: [],
  view: {x:0, y:0, s:1},       // Tab4 画布视图(平移+缩放)
  linkMode: false,             // Tab4 连线模式
  linkFrom: null,              // 连线起点 nid
  instanceLib: [],             // Tab3 节点实例库(拖拽建节点)
};
function sessionRunning() { return state.sessionState === 4 || state.sessionState === 5; }

// ── Tab4 画布缩放平移 ──
function applyView() {
  document.getElementById('world').style.transform = `translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.s})`;
  document.getElementById('zoomLabel').textContent = Math.round(state.view.s * 100) + '%';
}
function zoomAt(mx, my, factor) {
  const s2 = Math.min(3, Math.max(0.2, state.view.s * factor));
  state.view.x = mx - (mx - state.view.x) * (s2 / state.view.s);
  state.view.y = my - (my - state.view.y) * (s2 / state.view.s);
  state.view.s = s2;
  applyView();
}
function zoomBy(factor) {
  const canvas = document.getElementById('canvas');
  zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, factor);
}
function resetView() { state.view = {x:0, y:0, s:1}; applyView(); }
function screenToWorld(cx, cy) {
  const rect = document.getElementById('canvas').getBoundingClientRect();
  return { x: (cx - rect.left - state.view.x) / state.view.s, y: (cy - rect.top - state.view.y) / state.view.s };
}

// ── Tab4 实例库 ──
let _ilSig = '';
// ── P-库: 实例库检索（搜索/分组折叠/常用置顶, 状态存 localStorage）──
var ilQuery = '';
var ilCollapsed = JSON.parse(localStorage.getItem('ilCollapsed') || '{"docker":false,"netns":false}');
var ilFavs = JSON.parse(localStorage.getItem('ilFavs') || '[]');
function ilPersist() {
  localStorage.setItem('ilCollapsed', JSON.stringify(ilCollapsed));
  localStorage.setItem('ilFavs', JSON.stringify(ilFavs));
}
function ilQueryChange() { ilQuery = document.getElementById('ilSearch').value.trim().toLowerCase(); renderInstanceLib(true); }
function ilToggleGroup(g) { ilCollapsed[g] = !ilCollapsed[g]; ilPersist(); renderInstanceLib(true); }
function ilToggleFav(ev, name) {
  ev.stopPropagation();
  ilFavs = ilIsFav(name) ? ilFavs.filter(n => n !== name) : ilFavs.concat([name]);
  ilPersist(); renderInstanceLib(true);
}
function ilIsFav(name) { return ilFavs.includes(name); }

async function loadInstanceLib() {
  try {
    const env = await api('GET', '/instances');   // 信封 {ok, data} — api() 返回完整响应
    state.instanceLib = (env && env.data) || [];
    renderInstanceLib();
  } catch (e) {
    document.getElementById('ilItems').innerHTML = `<div class="il-empty">实例库加载失败: ${esc(String(e.error || e))}</div>`;
  }
}
function renderInstanceLib(force) {
  const el = document.getElementById('ilItems');
  if (!state.instanceLib.length) {
    if (_ilSig !== 'empty') {
      el.innerHTML = '<div class="il-empty">暂无实例（去「节点实例」页创建）<br><a href="/static/instances.html" style="color:var(--accent)">打开实例管理 →</a></div>';
      _ilSig = 'empty';
    }
    return;
  }
  const q = ilQuery.toLowerCase();
  const matches = state.instanceLib.filter(i => !q ||
    [i.name, i.image_tag || '', (i.services || []).map(s => s.name).join(' ')].join(' ').toLowerCase().includes(q));
  if (!force && JSON.stringify([q, ilFavs, ilCollapsed, matches.map(i => [i.name, i.runtime_type])]) === _ilSig) return;
  _ilSig = JSON.stringify([q, ilFavs, ilCollapsed, matches.map(i => [i.name, i.runtime_type])]);
  // 分组: docker 靶标容器 / netns 系统节点; 组内常用置顶
  const groups = [
    { key: 'docker', label: '🐳 靶标容器', items: matches.filter(i => i.runtime_type === 'docker') },
    { key: 'netns', label: '🖥 系统节点', items: matches.filter(i => i.runtime_type === 'netns') },
  ];
  groups.forEach(g => g.items.sort((a, b) => (ilIsFav(b.name) ? 1 : 0) - (ilIsFav(a.name) ? 1 : 0)));
  let html = '';
  groups.forEach(g => {
    if (!g.items.length) return;
    html += `<div class="il-group" onclick="ilToggleGroup('${g.key}')">${g.label}${ilCollapsed[g.key] ? ' ▸' : ' ▾'} (${g.items.length})</div>`;
    if (ilCollapsed[g.key]) return;
    g.items.forEach(inst => {
      const fav = ilIsFav(inst.name);
      html += `<div class="il-item" draggable="true" data-name="${esc(inst.name)}"
        ondragstart="ilDragStart(event,'${esc(inst.name)}')" ondragend="ilDragEnd(event)" ondblclick="ilToggleFav(event,'${esc(inst.name)}')">
        ${inst.runtime_type === 'docker' ? '🐳' : '🖥'} ${esc(inst.name)}<span class="il-fav ${fav ? 'on' : ''}" onclick="ilToggleFav(event,'${esc(inst.name)}')" title="常用置顶">⭐</span>
        <div class="rt">${inst.runtime_type === 'docker' ? esc(inst.image_tag || '') : 'netns（宿主 rootfs）'}${(inst.services||[]).length ? ' · ' + inst.services.length + ' 服务' : ''}</div>
      </div>`;
    });
  });
  el.innerHTML = html || '<div class="il-empty">无匹配实例（调整搜索词）</div>';
}
function ilDragStart(e, name) {
  e.dataTransfer.setData('text/instance-name', name);
  e.dataTransfer.effectAllowed = 'copy';
  e.target.classList.add('dragging-item');
}
function ilDragEnd(e) { e.target.classList.remove('dragging-item'); }
async function createNodeFromInstance(inst, wx, wy) {
  if (!state.currentSid) { addLog('先选择/创建会话', 'err'); return; }
  if (sessionRunning()) { addLog('🔒 RUNTIME 已冻结：不可新建节点（停止会话后再编辑，设计 §6.2）', 'err'); return; }
  const used = Object.values(state.nodes).map(n => n.name);
  let name = inst.name, i = 2;
  while (used.includes(name)) { name = inst.name + '-' + i; i++; }
  const body = { name, position: { x: Math.round(wx - 60), y: Math.round(wy - 40) }, instance: inst.name };
  if (inst.runtime_type === 'docker') { body.type = 15; body.image = inst.image_tag; }
  else { body.type = 0; if (inst.model) body.model = inst.model; }
  const svcNames = (inst.services || []).map(s => s.name).filter(Boolean);
  if (svcNames.length) body.services = svcNames;
  try {
    const r = await api('POST', `/api/sessions/${state.currentSid}/nodes`, body);
    addLog(`+ 节点 ${name} (id=${r.node_id}) ← 实例 ${inst.name}${svcNames.length ? ' 服务: ' + svcNames.join(',') : ''}`, 'ok');
    await loadTopology(state.currentSid);
  } catch (e) { addLog('创建节点失败: ' + (e.error?.detail || e.error || e), 'err'); }
}

// ── Helpers ──
async function api(method, path, data) {
  const opts = { method, headers: {} };
  if (data !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(data);
  }
  const resp = await fetch(`${API}${path}`, opts);
  const text = await resp.text();
  try {
    const json = JSON.parse(text);
    if (!resp.ok) throw { status: resp.status, ...json };
    return json;
  } catch (e) {
    if (e.status) throw e;
    if (!resp.ok) throw { status: resp.status, error: text };
    return text;
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function log(msg, type='info') {
  const t = new Date().toLocaleTimeString();
  state.log.push({t, msg, type});
  if (document.querySelector('.panel-tab.active')?.textContent.includes('日志')) {
    renderLog();
  }
}

function addLog(msg, type) {
  if (!type) type = 'info';
  var t = new Date().toLocaleTimeString();
  state.log.push({t: t, msg: msg, type: type});
  /* also append to DOM if log container exists */
  var lc = document.getElementById('logContainer');
  if (lc) {
    var entry = '<div class="log-entry"><span class="log-time">['+t+']</span> <span class="log-'+type+'">'+msg+'</span></div>';
    lc.innerHTML += entry;
    lc.scrollTop = lc.scrollHeight;
  }
}

async function loadTopology(sid) {
  try {
    const data = await api('GET', `/api/sessions/${sid}`);
    const nodesMap = {};
    for (const n of (data.nodes || [])) {
      const pos = n.position || {x: 200, y: 200};
      nodesMap[n.id] = { ...n, name:n.display_name || n.name, x: pos.x, y: pos.y };
    }
    state.nodes = nodesMap;
    state.links = data.links || [];
    state.sessionState = data.state ?? null;
    if(data.identity_status==='pending')addLog(data.identity_message || '会话归属待确认，暂不归入旧演练','err');
    state.selectedLink = null;

    renderTopology();
    updateFreezeUi();
    const _ec = document.getElementById('emptyCanvas'); if (_ec) _ec.style.display = 'none';
    addLog(`加载拓扑: ${Object.keys(state.nodes).length} 节点, ${state.links.length} 链路`, 'ok');
    state.exportedTopology = await api('GET', `/api/sessions/${sid}/topology`);
    renderTopologyJson();
  } catch(e) {
    addLog(`加载拓扑失败: ${e.error || e}`, 'err');
  }
}

// ── Topology Render ──
function renderTopology() {
  const container = document.getElementById('nodesContainer');
  const svg = document.getElementById('linksSvg');
  const nodes = Object.values(state.nodes);

  if (nodes.length === 0) {
    container.innerHTML = '<div class="empty-state" id="emptyCanvas"><div class="icon">◇</div><p>此会话无节点</p></div>';
    svg.innerHTML = '';
    return;
  }

  // Auto-layout if all at default position
  const allDefault = nodes.every(n => n.x === 200 && n.y === 200);
  if (allDefault) {
    const cols = Math.min(nodes.length, 4);
    nodes.forEach((n, i) => {
      n.x = 80 + (i % cols) * 180;
      n.y = 80 + Math.floor(i / cols) * 140;
    });
  }

  // Compute link lines
  let linkSvg = '';
  const linkMap = {};
  const selKey = state.selectedLink ? [state.selectedLink.node1_id, state.selectedLink.node2_id].sort().join('-') : null;
  for (const l of state.links) {
    const n1 = state.nodes[l.node1_id];
    const n2 = state.nodes[l.node2_id];
    if (!n1 || !n2) continue;
    const key = [l.node1_id, l.node2_id].sort().join('-');
    if (linkMap[key]) continue;
    linkMap[key] = true;
    const x1 = n1.x + 60, y1 = n1.y + 40;
    const x2 = n2.x + 60, y2 = n2.y + 40;
    const label = l.iface1?.ip4 || l.iface2?.ip4 ? `${l.iface1?.ip4||''} ↔ ${l.iface2?.ip4||''}` : '';
    const sel = key === selKey ? ' selected' : '';
    // 可见细线 stroke-width:2 命中带太小(±1px), 肉眼看着点上实际差 1px 就不触发。
    // 标准解法: 先垫一条透明粗 hit 线(16px, round cap)承载点击, 可见线不参与命中。
    linkSvg += `<line class="link-hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" onclick="selectLink(${l.node1_id}, ${l.node2_id})"/>`;
    linkSvg += `<line class="link-line${sel}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (label) {
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      linkSvg += `<text x="${mx}" y="${my-8}" text-anchor="middle" fill="#94a3b8" font-size="10" onclick="selectLink(${l.node1_id}, ${l.node2_id})" style="cursor:pointer">${label}</text>`;
    }
  }
  svg.innerHTML = linkSvg;

  // Node boxes
  container.innerHTML = nodes.map(n => {
    const ifaces = n._interfaces || [];
    const ip = ifaces.length > 0 ? ifaces[0].ip4 : '';
    const iconPath = n.type === 4 ? 'M3 8h18M3 16h18M7 8v8M17 8v8' : n.type === 6 ? 'M5 9a10 10 0 0 1 14 0M8 12a6 6 0 0 1 8 0M11 15a2 2 0 0 1 2 0M12 18h.01' : n.type === 15 ? 'M5 4h14v6H5zM5 14h14v6H5zM8 7h.01M8 17h.01' : n.model === 'router' ? 'M4 12h16M12 4v16M7 7l-3 5 3 5M17 7l3 5-3 5' : 'M5 4h14v12H5zM3 20h18M9 16v4M15 16v4';
    const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+iconPath+'"/></svg>';
    return `<div class="node-box ${n.id === state.selectedNode ? 'selected' : ''} ${state.linkMode && n.id === state.linkFrom ? 'link-src' : ''}"
      id="node-${n.id}"
      style="left:${n.x}px;top:${n.y}px"
      onmousedown="startDrag(event, ${n.id})"
      onclick="onNodeClick(${n.id})"
      ondblclick="showCommandModal(${n.id})">
      <div class="icon">${icon}</div>
      <div class="label">${n.name}</div>
      ${ip ? `<div class="ip">${ip}</div>` : ''}
    </div>`;
  }).join('');

  // Tab4 连线模式: 起点 → 鼠标位置的预览虚线
  if (state.linkMode && state.linkFrom !== null && state.nodes[state.linkFrom]) {
    const fn = state.nodes[state.linkFrom];
    svg.innerHTML += `<line class="link-preview" x1="${fn.x + 60}" y1="${fn.y + 40}" x2="${fn.x + 140}" y2="${fn.y + 40}"/>`;
  }
}

// ── Drag ──
function startDrag(e, nid) {
  if (e.button !== 0) return;
  const box = document.getElementById(`node-${nid}`);
  if (!box) return;
  const canvas = document.getElementById('canvas');
  // Tab4: 画布有缩放平移, 拖拽坐标一律走世界坐标系
  const w = screenToWorld(e.clientX, e.clientY);
  state.dragging = nid;
  state.dragOffset = { x: w.x - state.nodes[nid].x, y: w.y - state.nodes[nid].y };
  box.classList.add('dragging');

  function onMove(ev) {
    if (state.dragging === null) return;
    const wv = screenToWorld(ev.clientX, ev.clientY);
    const x = wv.x - state.dragOffset.x;
    const y = wv.y - state.dragOffset.y;
    box.style.left = `${Math.max(0, x)}px`;
    box.style.top = `${Math.max(0, y)}px`;
  }
  function onUp() {
    if (state.dragging !== null) {
      const nid = state.dragging;
      const n = state.nodes[nid];
      if (n) {
        n.x = parseInt(box.style.left) || n.x;
        n.y = parseInt(box.style.top) || n.y;
        /* persist new position to backend so it survives session reload */
        const sid = state.currentSid;
        if (sid) {
          api('POST', '/api/sessions/'+sid+'/nodes/'+nid+'/move', {position:{x:n.x, y:n.y}})
            .catch(function(e){ addLog('Move save failed: '+(e.error||e), 'err'); });
        }
      }
      box.classList.remove('dragging');
      state.dragging = null;
    }
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  e.preventDefault();
}

// ── Tab4 连线模式（点起点 → 点终点 → POST /links）──
function toggleLinkMode() {
  if (!state.linkMode && sessionRunning()) {
    addLog('🔒 RUNTIME 已冻结：不可连线（停止会话后再编辑，设计 §6.2）', 'err');
    return;
  }
  state.linkMode = !state.linkMode;
  state.linkFrom = null;
  const canvas = document.getElementById('canvas');
  canvas.classList.toggle('linking', state.linkMode);
  document.getElementById('linkModeBtn').classList.toggle('btn-primary', state.linkMode);
  if (state.linkMode) addLog('连线模式：先点起点节点，再点终点节点（ESC 退出）', 'info');
  renderTopology();
}
function onNodeClick(nid) {
  if (state.linkMode) { handleLinkClick(nid); return; }
  selectNode(nid);
}
async function handleLinkClick(nid) {
  if (state.linkFrom === null) {
    state.linkFrom = nid;
    renderTopology();
    addLog(`连线: 起点 [${state.nodes[nid]?.name}]，再点另一个节点`, 'info');
    return;
  }
  if (state.linkFrom === nid) { state.linkFrom = null; renderTopology(); return; }
  const a = state.linkFrom, b = nid;
  state.linkFrom = null;
  if (sessionRunning()) { addLog('🔒 RUNTIME 已冻结：不可连线（设计 §6.2）', 'err'); renderTopology(); return; }
  try {
    await api('POST', `/api/sessions/${state.currentSid}/links`, { node1_id: a, node2_id: b });
    addLog(`+ 链路 [${state.nodes[a]?.name}] ↔ [${state.nodes[b]?.name}] 已创建`, 'ok');
    await loadTopology(state.currentSid);
  } catch (e) { addLog('连线失败: ' + (e.error?.detail || e.error || e), 'err'); }
}

// ── Tab4 画布事件: 滚轮缩放 / 空白拖动平移 / 实例拖放 ──
(function initCanvasEvents() {
  const canvas = document.getElementById('canvas');
  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.15 : 1/1.15);
  }, { passive: false });

  canvas.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    if (e.target.closest('.node-box') || e.target.closest('.instance-lib') || e.target.closest('.canvas-tools')) return;
    const startX = e.clientX, startY = e.clientY;
    const v0 = { ...state.view };
    function onMove(ev) {
      state.view.x = v0.x + (ev.clientX - startX);
      state.view.y = v0.y + (ev.clientY - startY);
      applyView();
    }
    function onUp() {
      canvas.classList.remove('panning');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    canvas.classList.add('panning');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  canvas.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  canvas.addEventListener('drop', function(e) {
    e.preventDefault();
    const name = e.dataTransfer.getData('text/instance-name');
    const inst = state.instanceLib.find(i => i.name === name);
    if (!inst) return;
    const w = screenToWorld(e.clientX, e.clientY);
    createNodeFromInstance(inst, w.x, w.y);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && state.linkMode) toggleLinkMode();
  });
})();

// ── P-画布构件: switch/hub 直接创建（纯二层构件, 无服务概念, 不经实例库）──
async function addComponent(kind) {
  if (!state.currentSid) { addLog('先选择/创建会话', 'err'); return; }
  if (sessionRunning()) { addLog('🔒 RUNTIME 已冻结：不可新建节点（设计 §6.2）', 'err'); return; }
  var type = kind === 'hub' ? 5 : 4;
  var prefix = kind === 'hub' ? 'hub' : 'switch';
  var used = Object.values(state.nodes).map(n => n.name);
  var name = prefix, i = 2;
  while (used.includes(name)) { name = prefix + i; i++; }
  var canvas = document.getElementById('canvas');
  var wx = canvas.clientWidth / 2, wy = canvas.clientHeight / 2;
  var w = screenToWorld(canvas.getBoundingClientRect().left + wx, canvas.getBoundingClientRect().top + wy);
  try {
    const r = await api('POST', `/api/sessions/${state.currentSid}/nodes`, {
      name, type, position: { x: Math.round(w.x - 60), y: Math.round(w.y - 40) } });
    addLog(`+ ${kind} 构件 ${name} (id=${r.node_id})`, 'ok');
    await loadTopology(state.currentSid);
  } catch (e) { addLog('创建失败: ' + (e.error?.detail || e.error || e), 'err'); }
}

// ── Tab4 冻结门禁 UI 同步（§6.2: RUNTIME 后新建/连线/删除禁用）──
function updateFreezeUi() {
  const frozen = sessionRunning();
  document.getElementById('startBtn').disabled=frozen;
  document.getElementById('stopBtn').disabled=!frozen;
  const chip = document.getElementById('freezeChip');
  if (chip) chip.style.display = frozen ? 'block' : 'none';
  const lib = document.getElementById('instanceLib');
  if (lib) lib.classList.toggle('frozen', frozen);
  const lb = document.getElementById('linkModeBtn');
  if (lb) {
    lb.disabled = frozen;
    lb.style.opacity = frozen ? .5 : 1;
  }
  // 预检只在 RUNTIME 后有意义（与编辑类按钮语义相反）
  const pb = document.getElementById('precheckBtn');
  if (pb) {
    pb.disabled = !frozen;
    pb.style.opacity = frozen ? 1 : .5;
  }
  if (frozen && state.linkMode) toggleLinkMode();
}

// ── A1 环境就绪度预检（声明一致性: 容器/服务 validate/编目端口; 平台不窥探镜像内容）──
async function runPrecheck() {
  if (!state.currentSid) { addLog('先选择会话', 'err'); return; }
  if (!sessionRunning()) { addLog('会话未运行——节点实例化后预检才有意义', 'err'); return; }
  addLog('就绪检查中…', 'info');
  try {
    const env = await api('POST', `/precheck?session_id=${state.currentSid}`, {});
    renderPrecheck(env.data);   // 信封 {ok, data}
  } catch (e) { addLog('预检失败: ' + (e.error?.detail || e.error || e), 'err'); }
}
function renderPrecheck(d) {
  const v = d.verdict;
  document.getElementById('pcVerdict').innerHTML = v === 'READY'
    ? '<span style="background:#052e16;color:#4ade80;border:1px solid #14532d;padding:2px 10px;border-radius:10px;font-size:12px">READY 就绪</span>'
    : '<span style="background:#450a0a;color:#f87171;border:1px solid #7f1d1d;padding:2px 10px;border-radius:10px;font-size:12px">NOT_READY 不就绪</span>';
  const rows = (d.nodes || []).map(n => {
    const svc = (n.services || []).map(s => {
      const color = s.result === 'ok' ? '#4ade80' : (s.result === 'no-validate' ? '#94a3b8' : '#f87171');
      return '<div style="font-size:12px;margin-bottom:2px"><span style="color:' + color + '">●</span> '
        + esc(s.name) + ' <span style="color:var(--fg2)">[' + esc(s.result) + ']</span>'
        + (s.validate && s.validate.length ? ' <span class="mono" style="font-size:11px;color:var(--fg2)">' + esc(s.validate.join(' && ')) + '</span>' : '')
        + '</div>';
    }).join('') || '<div style="font-size:12px;color:var(--fg2)">无服务声明</div>';
    const ports = (n.ports || []).map(p => {
      const color = p.result === 'open' ? '#4ade80' : '#f87171';
      return '<span style="color:' + color + '">' + esc(p.port) + '/' + esc(p.result) + '</span>';
    }).join('  ') || '<span style="color:var(--fg2)">—</span>';
    const notes = (n.notes || []).map(x => '<div style="font-size:11px;color:var(--warn)">⚠ ' + esc(x) + '</div>').join('');
    return '<tr>'
      + '<td class="mono" style="padding:6px;border-top:1px solid var(--bg3)">' + esc(n.name) + ' (id=' + n.node_id + ')</td>'
      + '<td style="padding:6px;border-top:1px solid var(--bg3)">' + n.runtime + '</td>'
      + '<td style="padding:6px;border-top:1px solid var(--bg3)">' + (n.runtime === 'docker' ? esc(n.container || '—') : '—') + '</td>'
      + '<td style="padding:6px;border-top:1px solid var(--bg3)">' + svc + '</td>'
      + '<td class="mono" style="padding:6px;border-top:1px solid var(--bg3)">' + ports + '</td>'
      + '<td style="padding:6px;border-top:1px solid var(--bg3)">' + notes + '</td></tr>';
  }).join('');
  document.getElementById('pcBody').innerHTML =
    '<table style="width:100%;border-collapse:collapse">'
    + '<thead><tr><th style="text-align:left;padding:6px;color:var(--fg2)">节点</th><th style="text-align:left;padding:6px;color:var(--fg2)">类型</th>'
    + '<th style="text-align:left;padding:6px;color:var(--fg2)">容器</th><th style="text-align:left;padding:6px;color:var(--fg2)">声明服务 (validate)</th>'
    + '<th style="text-align:left;padding:6px;color:var(--fg2)">编目端口</th><th style="text-align:left;padding:6px;color:var(--fg2)">备注</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table>';
  document.getElementById('precheckModal').style.display = 'flex';
  addLog('就绪检查完成: ' + v, v === 'READY' ? 'ok' : 'err');
}

// ── Select Node ──
function selectNode(nid) {
  state.selectedNode = nid;
  renderTopology();
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel-tab')[1].click(); // switch to command

function showCommandModal(nid) {
  state.selectedNode = nid;

  document.getElementById('cmdOutput').value = '';

async function quickCommand() {
  const nid = Number(document.getElementById('quickCmdNode').value);
  const command = document.getElementById('quickCmdInput').value.trim();
  const output = document.getElementById('quickCmdResult');
  if (!command || !state.currentSid || !nid) return;
  output.textContent = '执行中…';
  try {
    const d = await api('POST', `/api/sessions/${state.currentSid}/nodes/${nid}/command`, {command, wait:true, shell:true});
    output.textContent = `rc=${d.return_code}\n${d.output || '(无输出)'}`.slice(-20000);
    output.style.whiteSpace = 'pre-wrap';
  } catch(e) { output.textContent = e.error || e.message || String(e); }
}
// ── Execute Command ──
async function executeCommand() {
  const nid = state.selectedNode;
  if (!nid) return addLog('请先选择节点', 'err');
  const cmd = document.getElementById('cmdInput').value.trim();
  if (!cmd) return;
  addLog(`▶ [${state.nodes[nid]?.name}] ${cmd}`, 'info');
  document.getElementById('cmdOutput').value = '执行中...';
  try {
    const resp = await api('POST', `/api/sessions/${state.currentSid}/nodes/${nid}/command`, {
      command: cmd, wait: true, shell: true
    });
    const out = resp.output || '(无输出)';
    document.getElementById('cmdOutput').value = out.length > 5000 ? out.slice(0,5000) + '\n... (截断)' : out;
    addLog(`✅ rc=${resp.return_code}`, resp.return_code === 0 ? 'ok' : 'err');
  } catch(e) {
    const msg = e.error || e.toString();
    document.getElementById('cmdOutput').value = `错误: ${msg}`;
    addLog(`❌ ${msg}`, 'err');
  }
}

// ── Session Actions ──
async function createSession() {
  try {
    const resp = await api('POST', '/api/sessions', {});
    state.currentSid = resp.id;
    addLog(`会话 ${resp.id} 已创建`, 'ok');
    closeModal('createModal');
    await loadSessions();
    await loadTopology(resp.id);
  } catch(e) { addLog(`创建失败: ${e.error||e}`, 'err'); }
}

async function startSession() {
  if (!state.currentSid) return;
  const def = false;
  try {
    const resp = await api('POST', `/api/sessions/${state.currentSid}/start`, { definition: def });
    addLog(`启动 ${def?'定义':'实例化'}: ${resp.result?'成功':'失败'}`, resp.result ? 'ok' : 'err');
    if (resp.exceptions?.length) addLog(`异常: ${resp.exceptions.join(', ')}`, 'err');
    await loadSessions();
    await loadTopology(state.currentSid);
  } catch(e) { addLog(`启动失败: ${e.error||e}`, 'err'); }
}

async function stopSession() {
  if (!state.currentSid) return;
  if (!confirm('停止会话？节点/链路定义将保留。')) return;
  try {
    const result = await api('POST', `/api/sessions/${state.currentSid}/stop`, {});
    if (!result.result) throw Error('停止未成功，拓扑保留状态请检查');
    addLog('会话已停止 (拓扑保留)', 'ok');
    await loadSessions();
    await loadTopology(state.currentSid);
  } catch(e) { addLog(`停止失败: ${e.error||e}`, 'err'); }
}

async function deleteSession() {
  if (!state.currentSid) return;
  if (!confirm('确定删除此会话？')) return;
  try {
    const result = await api('DELETE', `/api/sessions/${state.currentSid}`);
    if (!result.result) throw Error('删除未成功，部署引用仍保留');
    addLog(`会话 ${state.currentSid} 已删除`, 'ok');
    state.currentSid = null;
    document.getElementById('stopBtn').style.display = 'none';
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('sessionInfo').innerHTML = '<span style="color:var(--fg2);font-size:13px">选择左侧会话开始</span>';
    state.nodes = {}; state.links = [];
    document.getElementById('nodesContainer').innerHTML = '<div class="empty-state" id="emptyCanvas"><div class="icon">◇</div><p>选择一个会话以查看拓扑</p></div>';
    document.getElementById('linksSvg').innerHTML = '';
    await loadSessions();
  } catch(e) { addLog(`删除失败: ${e.error||e}`, 'err'); }
}

// ── Import Topology ──
function showImportModal() {
  document.getElementById('importFile').value = '';
  document.getElementById('createModal').style.display = 'flex';
  document.querySelector('#createModal h2').textContent = '导入拓扑';
}

async function importTopology() {
  const file = document.getElementById('importFile').files[0];
  if (!file) return addLog('请先选择拓扑文件', 'err');
  const text = await file.text();
  const type = file.name.toLowerCase().endsWith('.xml') ? 'xml' : 'json';
  try {
    let resp;
    if (type === 'xml') {
      const fetchResp = await fetch('/api/topology', {
        method: 'POST',
        headers: { 'Content-Type': 'application/xml' },
        body: text
      });
      resp = await fetchResp.json();
    } else {
      resp = await api('POST', '/api/topology', JSON.parse(text));
    }
    if (resp.session_id) {
      addLog(`拓扑已导入: 会话 ${resp.session_id} (${resp.nodes}节点, ${resp.links}链路)`, 'ok');
      closeModal('createModal');
      document.querySelector('#createModal h2').textContent = '创建会话';
      await loadSessions();
      state.currentSid = resp.session_id;
      renderSessions();
      await loadTopology(resp.session_id);
    }
  } catch(e) {
    addLog(`导入失败: ${e.error || e.message || e}`, 'err');
  }
}

function showCreateSessionModal() {
  document.getElementById('importText').value = '';
  document.querySelector('#createModal h2').textContent = '创建会话';
  document.getElementById('createModal').style.display = 'flex';
}

// ── Panel Switching ──
function switchPanel(name) {
  if(name!=='events')stopEvents();
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  const pc = document.getElementById('panelContent');

  if (name === 'log') {
    renderLog();
  } else if (name === 'command') {
    pc.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;padding:8px 0">
      <div style="display:flex;gap:8px;align-items:center">
        <span style="color:var(--fg2);font-size:13px">节点:</span>
        <select id="quickCmdNode" style="width:auto;flex:1" onchange="state.selectedNode=parseInt(this.value)">
          ${Object.values(state.nodes).map(n => `<option value="${n.id}" ${n.id===state.selectedNode?'selected':''}>${n.name} (id=${n.id})</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:8px">
        <input id="quickCmdInput" placeholder="输入命令..." style="flex:1" onkeydown="if(event.key==='Enter')quickCommand()">
        <button class="btn btn-primary btn-sm" onclick="quickCommand()">▶ 执行</button>
      </div>
      <div id="quickCmdResult" style="font-size:12px;color:var(--fg2);margin-top:4px"></div>
    </div>`;
  } else if (name === 'events') {
    var existingEvents = document.getElementById('eventsOutput');
    if (!existingEvents) {
      pc.innerHTML = '<div style="display:flex;gap:8px;margin-bottom:8px">' +
        '<button class="btn btn-secondary btn-sm" onclick="startEvents()">▶ 开启事件流</button>' +
        '<button class="btn btn-secondary btn-sm" onclick="stopEvents()">⏹ 停止</button>' +
        '</div><div id="eventsOutput" style="font-size:12px;color:var(--fg2)">等待开启...</div>';
    } else {
      /* events container already exists, just show it */
      var parent = existingEvents.parentNode;
      parent.style.display = 'block';
    }
  } else if (name === 'topology') {
    renderTopologyJson();
  }
}

function renderLog() {
  var pc = document.getElementById('panelContent');
  var lc = document.getElementById('logContainer');
  if (!lc) {
    pc.innerHTML = '<div id="logContainer"></div>';
    lc = document.getElementById('logContainer');
  }
  var items = state.log.slice(-200);
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var l = items[i];
    html += '<div class="log-entry"><span class="log-time">['+l.t+']</span> <span class="log-'+l.type+'">'+l.msg+'</span></div>';
  }
  lc.innerHTML = html;
  pc.scrollTop = pc.scrollHeight;
}
var eventsActive = false;
function startEvents() {
  if (!state.currentSid || eventsActive) return;
  eventsActive = true;
  const es = new EventSource(`/api/sessions/${state.currentSid}/events/stream`);
  const output = document.getElementById('eventsOutput');
  output.textContent = '正在建立 CORE 订阅…\n';
  es.addEventListener('ready',()=>{ output.textContent += '🟢 监听事件中\n'; });
  es.addEventListener('identity-pending',e=>{output.textContent+='归属待确认: '+Platform.describeText(e.data)+'\n';});
  es.addEventListener('upstream-error',e=>{output.textContent+='上游订阅中断: '+Platform.describeText(e.data)+'\n';});
  es.addEventListener('truncated',e=>{output.textContent += '事件缓冲已截断: '+Platform.describeText(e.data)+'\n';});
  es.onmessage = (e) => {
    output.textContent += Platform.describeText(e.data) + '\n';
    output.scrollTop = output.scrollHeight;
    if (output.innerHTML.length > 50000) {
      output.innerHTML = output.innerHTML.slice(-30000);
    }
  };
  es.onerror = () => { output.textContent += '⚠️ 事件流断开，正在重连\n'; };
  state.eventSource = es;
}

function stopEvents() {
  if (state.eventSource) {
    state.eventSource.close();
    state.eventSource = null;
    eventsActive = false;
    const output = document.getElementById('eventsOutput'); if (output) output.textContent += '⏹ 已停止\n';
  }
}

function renderTopologyJson() {
  const pc = document.getElementById('panelContent');
  const topo = state.exportedTopology || {};
  pc.replaceChildren(Platform.fields(topo), Platform.button('导出配置', () => Platform.download(new Blob([JSON.stringify(topo, null, 2)], {type:'application/json'}), 'topology.json')));
}

// ── 5-Tab 前端路由（设计 §2.1: 同一单页内切换, hash 保持刷新/前进后退）──
const TAB_SRC = {
  images:    '/static/target-admin.html',
  topologies: '/static/topologies.html',
  containers:'/static/containers.html',
  instances: '/static/instances.html',
  monitor:   '/static/monitor.html',
  audit:     '/static/audit.html',
};
function switchTab(name) {
  if(name==='drafts')name='topologies';
  if(name==='publications')name='images';
  if(name!=='topo'&&!TAB_SRC[name])return;
  const labels={images:'镜像管理',containers:'容器管理',instances:'节点模板',topologies:'拓扑管理',topo:'拓扑管理 · 运行画布',monitor:'数据监测',audit:'审计日志'};
  const category=['images','containers','instances'].includes(name)?'资源管理':['monitor','audit'].includes(name)?'运行与复盘':'环境构建';
  document.body.dataset.activeTab=name;
  document.getElementById('workspaceTitle').textContent=labels[name];
  document.getElementById('workspaceCategory').textContent=category;
  document.title=labels[name]+' · CORE Bridge';
  document.querySelectorAll('.side-tab').forEach(t=>t.setAttribute('aria-current',t.dataset.tab===(name==='topo'?'topologies':name)?'page':'false'));
  if(name!=='topo')stopEvents();
  const frame = document.getElementById('tabFrame');
  document.querySelectorAll('.side-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === (name==='topo'?'topologies':name)));
  if (name === 'topo') {
    // 拓扑 = 本页 canvas 视图; 离开监测等定时视图时释放 iframe 资源
    frame.style.display = 'none';
    frame.contentWindow.location.replace('about:blank');
    frame.removeAttribute('data-src');  // ★ 必须清缓存, 否则 topo→X 时误判"src 没变"不再加载 → 空白
    loadInstanceLib();  // 切回拓扑时刷新实例库(实例可能在其它页面被增删)
    if (location.hash && location.hash !== '#topo') history.pushState(null, '', '#topo');
    return;
  }
  const src = TAB_SRC[name];
  if (!src) return;
  if (frame.getAttribute('data-src') !== src) {
    frame.contentWindow.location.replace(src + '?embedded=1');
    frame.setAttribute('data-src', src);
  }
  frame.style.display = 'block';
  if (location.hash !== '#' + name) history.pushState(null, '', '#' + name);
}
function tabFromHash() {
  const h = (location.hash || '#images').replace('#', '');
  return h==='drafts'?'topologies':h==='publications'?'images':h === 'topo' || TAB_SRC[h] ? h : 'images';   // 默认视图 = 镜像管理
}
window.addEventListener('hashchange', () => switchTab(tabFromHash()));

async function checkConnectivity() {
  if (!state.currentSid) return addLog('请先选择会话','err');
  try { const d=await api('POST',`/api/sessions/${state.currentSid}/connectivity`,{}); addLog('联通检查: '+Platform.describe(d.data),'info'); }
  catch(e) { addLog('联通检查失败: '+(e.detail || e.error || e.message),'err'); }
}
async function saveSessionDraft() {
  if (!state.currentSid) return addLog('请先选择会话','err');
  try { const d = await api('POST', `/api/sessions/${state.currentSid}/draft`); addLog('拓扑已保存 '+d.data.topology_id,'ok'); switchTab('drafts'); }
  catch(e) { addLog('保存拓扑失败: '+(e.error || e.detail || e.message),'err'); }
}
window.addEventListener('message', async e => {
  if(e.origin!==location.origin)return;
  if(e.data?.type==='open-publication'){switchTab('images');return;}
  if (e.data?.type !== 'deployment-created') return;
  await loadSessions(); switchTab('topo'); if(e.data.sid)await selectSession(Number(e.data.sid));
});
window.addEventListener('pagehide',stopEvents);
// ── Init ──
async function init() {
  addLog('CORE Bridge 工作区已加载', 'info');
  applyView();
  loadInstanceLib();
  setInterval(loadInstanceLib, 30000);  // 实例库自动刷新(实例可能在其它页面被增删)
  switchTab(tabFromHash());
  await loadSessions();

  // Auto-select first session
  if (state.sessions.length > 0) {
    const requested=Number(new URLSearchParams(location.search).get('session'));
    await selectSession(state.sessions.find(s=>s.id===requested)?.id||state.sessions[0].id);
  }
}
init();

      showCtxMenu(e.clientX, e.clientY, items);
      return;
    }
    menu.style.display = 'none';
    return;
  }
  e.preventDefault();
  ctxNodeId = parseInt(box.id.replace('node-', ''));
  // Tab4 §6.2: RUNTIME 冻结后右键仅剩「查看/终端」, 删除与连线入口全部禁用
  var items = [];
  var ctxNd = state.nodes[ctxNodeId];
  var isComp = ctxNd && (ctxNd.type === 4 || ctxNd.type === 5);  // switch/hub 纯构件: 无终端
  if (state.linkMode && state.linkFrom !== null && state.linkFrom !== ctxNodeId && !sessionRunning()) {
    items.push({ label: '连线到此节点', action: 'handleLinkClick('+ctxNodeId+')' }, { type: 'divider' });
  }
  items.push(
    { label: '📟 Properties', action: 'showNodeProps('+ctxNodeId+')' },
  );
  if (!isComp) items.push({ label: '💻 Terminal', action: 'openTerminal('+ctxNodeId+')' });
  items.push(
    { type: 'divider' },
    { label: '导出节点配置', action: 'copyNodeJson('+ctxNodeId+')' },
  );
  if (!sessionRunning()) {
    items.push(
      { type: 'divider' },
      { label: '🔗 设为连线起点', action: 'ctxLinkFrom('+ctxNodeId+')' },
      { type: 'divider' },
      { label: '🗑 Delete', action: 'deleteNode('+ctxNodeId+')', danger: true },
    );
  }
  showCtxMenu(e.clientX, e.clientY, items);
});

function ctxLinkFrom(nid) {
  document.getElementById('contextMenu').style.display = 'none';
  if (!state.linkMode) toggleLinkMode();
  state.linkFrom = nid;
  renderTopology();
  addLog(`连线: 起点 [${state.nodes[nid]?.name}]，再点另一个节点（或右键另一节点选连线起点）`, 'info');
}
function createNodeFromInstanceAt(idx, x, y) {
  document.getElementById('contextMenu').style.display = 'none';
  createNodeFromInstance(state.instanceLib[idx], x + 60, y + 40);
}
function hideCtx() { document.getElementById('contextMenu').style.display = 'none'; }

document.addEventListener('click', function(e) {
  if (!e.target.closest('.context-menu')) {
    document.getElementById('contextMenu').style.display = 'none';
  }
});

function showCtxMenu(x, y, items) {
  var menu = document.getElementById('contextMenu');
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    if (item.type === 'divider') { html += '<div class="context-menu-divider"></div>'; continue; }
    var cls = 'context-menu-item' + (item.danger ? ' danger' : '');
    html += '<div class="'+cls+'" onclick="'+item.action+'">'+item.label+'</div>';
  }
  menu.innerHTML = html;
  menu.style.display = 'block';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  var r = menu.getBoundingClientRect();
  if (r.right > window.innerWidth) menu.style.left = (window.innerWidth - r.width - 10) + 'px';
  if (r.bottom > window.innerHeight) menu.style.top = (window.innerHeight - r.height - 10) + 'px';
}

// ── Node Properties ──

async function replaceNodeTemplate() {

}
async function saveNodeProps() {

// ── Link Properties(链路查询/修改) ──
function linkKey(n1, n2) { return [n1, n2].sort((a,b)=>a-b).join('-'); }

function findLink(n1, n2) {
  const key = linkKey(n1, n2);
  for (const l of state.links) {
    if (linkKey(l.node1_id, l.node2_id) === key) return l;
  }
  return null;
}

function selectLink(n1, n2) {
  const l = findLink(n1, n2);
  if (!l) { addLog('链路未找到: '+n1+'-'+n2, 'err'); return; }
  state.selectedLink = l;
  renderTopology();
  showLinkProps();
}

// 删除链路（定义态; RUNTIME 冻结由按钮禁用 + 双重校验, §6.2）
async function deleteSelectedLink() {
  const l = state.selectedLink;
  if (!l) return;
  if (sessionRunning()) { addLog('🔒 RUNTIME 已冻结：不可删除链路（设计 §6.2）', 'err'); return; }
  const n1 = state.nodes[l.node1_id]?.name || l.node1_id;
  const n2 = state.nodes[l.node2_id]?.name || l.node2_id;
  if (!confirm(`删除链路 ${n1} ↔ ${n2} ？`)) return;
  try {
    await api('DELETE', `/api/sessions/${state.currentSid}/links`, {
      node1_id: l.node1_id, node2_id: l.node2_id,
      iface1: { id: l.iface1?.id ?? 0 }, iface2: { id: l.iface2?.id ?? 0 },
    });
    addLog(`🗑 链路 [${n1}] ↔ [${n2}] 已删除`, 'ok');
    closeModal('linkModal');
    state.selectedLink = null;
    await loadTopology(state.currentSid);
  } catch (e) { addLog('删除链路失败: ' + (e.error?.detail || e.error || e), 'err'); }
}

function showLinkProps() {
  const l = state.selectedLink;
  if (!l) return;
  const n1 = state.nodes[l.node1_id];
  const n2 = state.nodes[l.node2_id];
  const name1 = n1 ? n1.name : 'node'+l.node1_id;
  const name2 = n2 ? n2.name : 'node'+l.node2_id;
  const i1 = l.iface1 || {}, i2 = l.iface2 || {};
  const o = l.options || {};
  const run = sessionRunning();
  // 删除链路按钮: RUNTIME 冻结(§6.2, CORE 运行中不可删链)
  const delBtn = document.getElementById('lkDeleteBtn');
  if (delBtn) {
    delBtn.disabled = run;
    delBtn.style.opacity = run ? .5 : 1;
    delBtn.title = run ? '运行中不可删除链路（CORE 协议限制）' : '';
  }
  document.getElementById('linkModalTitle').textContent =
    `🔗 ${name1} (${l.node1_id}) ↔ ${name2} (${l.node2_id})`;
  document.getElementById('linkModalBody').innerHTML = `
    <div class="prop-grid">
      <div><div class="prop-label">接口1 ID</div>
        <input class="prop-value" value="${i1.id ?? ''}" readonly></div>
      <div><div class="prop-label">接口2 ID</div>
        <input class="prop-value" value="${i2.id ?? ''}" readonly></div>
      <div><div class="prop-label">接口1 IP (node ${l.node1_id})</div>
        <input class="prop-value" id="lk_ip1" value="${i1.ip4||''}" placeholder="${run?'运行中锁定':'如 10.0.0.1'}" ${run?'readonly':''}></div>
      <div><div class="prop-label">接口1 掩码</div>
        <input class="prop-value" id="lk_mask1" type="number" min="0" max="32" value="${i1.ip4_mask??''}" placeholder="24" ${run?'readonly':''}></div>
      <div><div class="prop-label">接口2 IP (node ${l.node2_id})</div>
        <input class="prop-value" id="lk_ip2" value="${i2.ip4||''}" placeholder="${run?'运行中锁定':'如 10.0.0.2'}" ${run?'readonly':''}></div>
      <div><div class="prop-label">接口2 掩码</div>
        <input class="prop-value" id="lk_mask2" type="number" min="0" max="32" value="${i2.ip4_mask??''}" placeholder="24" ${run?'readonly':''}></div>
      <div><div class="prop-label">带宽 bandwidth (bps)</div>
        <input class="prop-value" id="lk_bw" type="number" value="${o.bandwidth??''}" placeholder="默认"></div>
      <div><div class="prop-label">延迟 delay (µs)</div>
        <input class="prop-value" id="lk_delay" type="number" value="${o.delay??''}" placeholder="默认"></div>
      <div><div class="prop-label">丢包 loss (%)</div>
        <input class="prop-value" id="lk_loss" type="number" step="0.1" value="${o.loss??''}" placeholder="默认"></div>
      <div><div class="prop-label">抖动 jitter (µs)</div>
        <input class="prop-value" id="lk_jitter" type="number" value="${o.jitter??''}" placeholder="默认"></div>
      <div class="full"><div class="prop-label">重复包 dup (%)</div>
        <input class="prop-value" id="lk_dup" type="number" step="0.1" value="${o.dup??''}" placeholder="默认"></div>
      <div class="full" style="color:var(--yellow);font-size:11px">
        ${run
          ? '⚠️ 运行中：接口 IP 已锁定（CORE 协议限制），仅可改 QoS（带宽/延迟/丢包等）。要改 IP 请先停止会话再打开本窗口。'
          : 'ⓘ 未运行：接口 IP/掩码可编辑，保存时后端自动删链重建（保留原 QoS），一次保存即可完成改 IP + 改 QoS。'}</div>
    </div>`;
  document.getElementById('linkModal').style.display = 'flex';
}

function saveLinkProps() {
  const l = state.selectedLink;
  if (!l) return;
  const sid = state.currentSid;
  const url = `/api/sessions/${sid}/links`;
  const running = sessionRunning();
  // QoS 参数：合并式更新，只覆盖传入字段；留空保持原值。
  const opts = {};
  const set = (id, k, num) => {
    const v = document.getElementById(id).value;
    if (v !== '') opts[k] = num ? (k==='loss'||k==='dup' ? parseFloat(v) : parseInt(v)) : v;
  };
  set('lk_bw', 'bandwidth', true); set('lk_delay', 'delay', true);
  set('lk_loss', 'loss', true); set('lk_jitter', 'jitter', true); set('lk_dup', 'dup', true);
  const body = { node1_id: l.node1_id, node2_id: l.node2_id, options: opts };
  // 未运行 + 填写了 IP → 前端同时带 iface(新 ip4/ip4_mask)；后端会自动删链重建保留 QoS。
  // 运行中 → 后端拒绝(409)，前端 IP 字段也已只读，不会走到这里。
  const ipChanged = () =>
    (document.getElementById('lk_ip1').value !== '' || document.getElementById('lk_mask1').value !== '')
    || (document.getElementById('lk_ip2').value !== '' || document.getElementById('lk_mask2').value !== '');
  if (!running && (Object.keys(opts).length > 0 || ipChanged())) {
    const i1 = l.iface1 || {}, i2 = l.iface2 || {};
    const rIp = (v, cur) => v !== '' ? v : (cur ?? null);
    const rMask = (v, cur) => cur!==undefined && v==='' ? cur : (v==='' ? undefined : parseInt(v));
    const ip1 = document.getElementById('lk_ip1').value;
    const ip2 = document.getElementById('lk_ip2').value;
    const mask1 = document.getElementById('lk_mask1').value;
    const mask2 = document.getElementById('lk_mask2').value;
    if (ip1 !== '' || mask1 !== '') {
      body.iface1 = { id: i1.id !== undefined ? i1.id : 0,
                      ip4: rIp(ip1, i1.ip4), ip4_mask: rMask(mask1, i1.ip4_mask) };
    }
    if (ip2 !== '' || mask2 !== '') {
      body.iface2 = { id: i2.id !== undefined ? i2.id : 0,
                      ip4: rIp(ip2, i2.ip4), ip4_mask: rMask(mask2, i2.ip4_mask) };
    }
  } else if (Object.keys(opts).length === 0) {
    addLog('未填写任何要修改的参数', 'err'); return;
  }
  api('PATCH', url, body)
    .then(r => { closeModal('linkModal');
      addLog(r.action === 'replace_ip' ? `链路 ${l.node1_id}-${l.node2_id} 接口 IP 已重建更新` : `链路 ${l.node1_id}-${l.node2_id} QoS 已更新`, 'ok');
      return loadTopology(sid); })
    .catch(e => addLog('链路更新失败: '+(e.error||e), 'err'));
}

function copyNodeJson(nid) {
  document.getElementById('contextMenu').style.display = 'none';
  var node = state.nodes[nid];
  if (!node) return;
  var obj = {id:nid, name:node.name, model:node.model, type:node.type, x:node.x, y:node.y, services:node.services};
  Platform.download(new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'}), 'node-'+nid+'.json');
  addLog('节点配置已导出', 'ok');
}

function deleteNode(nid) {
  document.getElementById('contextMenu').style.display = 'none';
  if (sessionRunning()) { addLog('🔒 RUNTIME 已冻结：不可删除节点（设计 §6.2）', 'err'); return; }
  if (!confirm('Delete node '+nid+'?')) return;
  var sid = state.currentSid;
  if (!sid) return;
  api('DELETE', '/api/sessions/'+sid+'/nodes/'+nid).then(function(){
    delete state.nodes[nid];
    renderTopology();
    addLog('Node '+nid+' deleted', 'ok');
  }).catch(function(e){addLog('Delete failed: '+(e.error||e), 'err');});
}
