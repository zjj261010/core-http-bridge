<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE Terminal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; color:#0f0; font-family:monospace; height:100vh; display:flex; flex-direction:column; }
.header { padding:8px 16px; background:#111; border-bottom:1px solid #222; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.header .title { color:#0f0; font-size:14px; font-weight:bold; }
.header .label { color:#888; font-size:12px; }
#output { flex:1; padding:12px; overflow-y:auto; white-space:pre-wrap; font-size:14px; line-height:1.5; }
#output .prompt { color:#0f0; }
#output .err { color:#f44; }
#output .info { color:#888; font-style:italic; }
.input-bar { display:flex; padding:8px 12px; gap:8px; background:#111; border-top:1px solid #222; align-items:center; }
#input { flex:1; background:#000; color:#0f0; border:1px solid #222; padding:8px 12px; border-radius:4px; font-family:monospace; font-size:14px; outline:none; }
#input:focus { border-color:#0f0; }
#input:disabled { opacity:0.4; }
#connBtn { padding:6px 16px; border-radius:4px; border:none; cursor:pointer; font-size:13px; font-weight:500; background:#22c55e; color:#000; }
#connBtn:hover { background:#16a34a; }
#connBtn.disconnect { background:#ef4444; color:#fff; }
#connBtn.disconnect:hover { background:#dc2626; }
#status { font-size:12px; color:#666; min-width:60px; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:#111; }
::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
</style>
</head>
<body>
<div class="header">
  <span class="title">▶ CORE Terminal</span>
  <span class="label" id="nodeLabel">node: --</span>
  <span class="label" id="sessionLabel">session: --</span>
</div>
<div id="output"><span class="info">[Ready. Click Connect.]</span></div>
<div class="input-bar">
  <button id="connBtn" onclick="toggleConn()">🔗 Connect</button>
  <span id="status">disconnected</span>
  <input id="input" placeholder="Type command, Enter to execute..." disabled>
</div>
<script>
var params = new URLSearchParams(location.search);
var sid = params.get('sid');
var nid = params.get('nid');
var nm = params.get('name') || 'node-'+nid;
document.getElementById('nodeLabel').textContent = 'node: '+nm+' ('+nid+')';
document.getElementById('sessionLabel').textContent = 'session: '+sid;
document.title = 'CORE Terminal - '+nm;

var ws = null;
var out = document.getElementById('output');
var inp = document.getElementById('input');
var sts = document.getElementById('status');
var btn = document.getElementById('connBtn');

function log(msg, cls) {
  var span = document.createElement('span');
  span.className = cls || '';
  span.textContent = msg + '\n';
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
  if (out.children.length > 200) out.removeChild(out.firstChild);
}

function toggleConn() {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.close(); return; }
  if (!sid || !nid) { log('Missing session or node ID', 'err'); return; }
  var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var url = proto + location.host + '/api/sessions/' + sid + '/nodes/' + nid + '/terminal/ws';
  try {
    ws = new WebSocket(url);
    ws.onopen = function() {
      sts.textContent = 'connected'; sts.style.color = '#22c55e';
      btn.textContent = '🔌 Disconnect'; btn.className = 'disconnect';
      inp.disabled = false; inp.focus();
      log('[Connected to ' + nm + ']', 'info');
    };
    ws.onmessage = function(e) {
      out.appendChild(document.createTextNode(e.data));
      out.scrollTop = out.scrollHeight;
      if (out.children.length > 200) out.removeChild(out.firstChild);
    };
    ws.onclose = function() {
      ws = null;
      sts.textContent = 'disconnected'; sts.style.color = '#666';
      btn.textContent = '🔗 Connect'; btn.className = '';
      inp.disabled = true;
      log('[Disconnected]', 'info');
    };
    inp.onkeydown = function(e) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (e.key === 'Enter') {
        ws.send(inp.value + '\n');
        log('$ ' + inp.value, 'prompt');
        inp.value = '';
      } else if (e.ctrlKey && e.key === 'c') { ws.send('\x03'); }
      else if (e.ctrlKey && e.key === 'd') { ws.send('\x04'); }
    };
  } catch(e) { log('Connection error: ' + e, 'err'); }
}
</script>
</body>
</html>
