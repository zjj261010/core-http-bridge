<script>
(() => {
const root=document.getElementById('image-services-design');
const clone=value=>structuredClone(value);
const file=(name,role='启动')=>({name,role,bytes:320});

const base={designVersion:3,view:'images',selected:0,work:null,child:null,serviceEditor:null,modeEditor:null,review:false,ack:false,dialogMessage:'',notice:'',importOpen:false,importName:'',importMode:'bundle',importOrigin:'upload',importPath:'/opt/artifacts/imports/',filePurpose:'停止',nativeModel:'PC',runtime:'docker',templateImage:0,topologyOpen:false,topologyTab:'nodes',nextId:40,pendingDelete:null,nodeIndex:1,importPreview:null,exportImage:null,catalogExport:false,exportScope:'config',images:[
 {id:'image-web',ref:'web-services:v1',aliases:'lab/web:stable',imageId:'sha256:49d1a2b49cf0',size:'214 MB',platform:'linux/amd64',workdir:'/',entry:'按所选服务模式启动',note:'Web、远程维护与缓存服务环境',revision:1,pending:false,services:[
  {id:'svc-http',name:'HTTP 服务',software:'2.4.49',ports:'80/tcp',description:'Web 服务',modes:[mode('mode-normal','常规启动',['httpd-start.sh'],true),{...mode('mode-lab','应用配置（依赖 Redis）',['httpd-lab.sh']),dependsOn:['svc-redis']}]},
  {id:'svc-ssh',name:'SSH 服务',software:'OpenSSH',ports:'22/tcp',description:'远程维护',modes:[mode('mode-ssh','默认启动',['sshd-start.sh'],true)]},
  {id:'svc-redis',name:'Redis 服务',software:'6.x',ports:'6379/tcp',description:'数据缓存',modes:[mode('mode-redis','常规启动',['redis-start.sh'],true),mode('mode-redis-open','无认证配置',['redis-open.sh'])]},
  {id:'svc-nginx',name:'Nginx 服务',software:'1.24',ports:'80/tcp',description:'反向代理',modes:[mode('mode-nginx','标准端口',['nginx-start.sh'],true),{...mode('mode-nginx-alt','备用端口 8080',['nginx-8080.sh']),ports:'8080/tcp'}]}
 ]},
 {id:'image-tools',ref:'python-tools:v1',aliases:'',imageId:'sha256:7934b4ba0128',size:'186 MB',platform:'linux/amd64',workdir:'/workspace',entry:'手动使用工具',note:'工具环境，没有必须自启动的服务',revision:1,pending:false,services:[]}
],templateSelections:{'image:image-web:svc-http':'mode-normal'},templateRevision:1,savedTemplate:{'svc-http':'mode-normal'},nativeServices:[{id:'core-ssh',name:'SSH',description:'CORE 原生远程服务'},{id:'core-route',name:'DefaultRoute',description:'默认路由'},{id:'core-forward',name:'IPForward',description:'IP 转发'}],topology:{name:'校园网实验',state:'未运行',runs:[],nodes:[{name:'网关',type:'netns',template:'系统路由器'}, {name:'Web 节点 A',type:'docker',template:'Web 环境模板',templateRevision:1,defaults:{'svc-http':'mode-normal'},overrides:null}, {name:'Web 节点 B',type:'docker',template:'Web 环境模板',templateRevision:1,defaults:{'svc-http':'mode-normal'},overrides:null}],links:[{from:'网关',to:'Web 节点 A',delay:'0',bandwidth:'100 Mbps'}]}};
const settings={sessionCount:'0'};
base.catalogs={'web-r1':clone(base.images[0].services)};
base.templateRecords={'image:image-web':{revision:1,selections:clone(base.savedTemplate),catalogKey:'web-r1'}};
for(const node of base.topology.nodes)if(node.type==='docker'){node.templateKey='image:image-web';node.catalogKey='web-r1';node.imageId=base.images[0].imageId;}
let focusTarget='';
function restored(saved){const s=saved?.privateContent||saved;return s?.designVersion===3&&(s.images===undefined||Array.isArray(s.images))?{...clone(base),...s,catalogs:{...clone(base.catalogs),...s.catalogs}}:clone(base);}
let state=restored(window.openai?.widgetState);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const selectedImage=()=>state.images[state.selected]||state.images[0];
const dirty=()=>!!state.work&&JSON.stringify(state.work.services)!==JSON.stringify(selectedImage().services);
const button=(label,act,attrs='',primary=false,disabled=false)=>`<button type="button" class="ip-button${primary?' primary':''}" data-act="${act}" ${attrs} ${disabled?'disabled':''}>${label}</button>`;
const link=(label,act,attrs='')=>`<button type="button" class="ip-link" data-act="${act}" ${attrs}>${label}</button>`;
const pill=(label,tone='')=>`<span class="ip-pill ${tone}">${esc(label)}</span>`;
function message(text){return text?`<div class="ip-notice" role="status">${esc(text)}</div>`:'';}
function persist(){const packed=clone(state);packed.catalogs=Object.fromEntries(Object.entries(state.catalogs).filter(([key,value])=>JSON.stringify(value)!==JSON.stringify(base.catalogs[key])));if(JSON.stringify(packed.images)===JSON.stringify(base.images))delete packed.images;
const modelContent={prototype:true,view:state.view,image:selectedImage().ref,service:state.child?.name||null,editingModes:!!state.child,pendingChanges:dirty(),confirmingRegistration:state.review,node:state.topology.nodes[state.nodeIndex]?.name||null};
const payload={modelContent,privateContent:packed};if(new TextEncoder().encode(JSON.stringify(payload)).byteLength>15000)payload.privateContent={designVersion:3,view:state.view,selected:state.selected};window.openai?.setWidgetState?.(payload)?.catch(()=>{});}

function title(name,description,actions=''){return `<div class="ip-head"><div><h1>${name}</h1><p class="ip-sub">${description}</p></div><div class="ip-actions">${actions}</div></div>`;}
const normalizedName=value=>value.trim().toLocaleLowerCase();
function nameIssues(items,label){const seen=new Set(),issues=[];for(const item of items){const name=normalizedName(item.name);if(!name)issues.push(label+'名称不能为空');else if(seen.has(name))issues.push(label+'名称重复：'+item.name);seen.add(name);}return issues;}
function portList(value){if(!value.trim())return [];return value.split(/[,，;；\s]+/).filter(Boolean).map(raw=>{const hit=raw.match(/^(\d+)\/(tcp|udp)$/i);return hit&&Number(hit[1])>0&&Number(hit[1])<=65535?{key:Number(hit[1])+'/'+hit[2].toLowerCase(),raw}: {invalid:true,raw};});}
function configurationIssues(services,allServices=services){const issues=nameIssues(services,'服务');for(const service of services){issues.push(...nameIssues(service.modes,service.name+' 的模式'));if(!service.modes.length)issues.push(service.name+' 尚未配置启动模式');for(const m of service.modes){if(m.strategy==='script'&&!m.files.some(f=>f.role==='启动'))issues.push(service.name+' / '+m.name+' 缺少启动脚本');for(const dep of m.dependsOn||[])if(!allServices.some(s=>s.id===dep))issues.push(service.name+' / '+m.name+' 依赖的服务已不在声明中');if(portList(m.ports||'').some(p=>p.invalid))issues.push(service.name+' / '+m.name+' 端口格式应为 80/tcp');}if(portList(service.ports||'').some(p=>p.invalid))issues.push(service.name+' 端口格式应为 80/tcp');}return issues;}
function liveIssues(){if(state.child)return configurationIssues([state.child],state.work.services);if(state.serviceEditor){const edit=state.serviceEditor;return nameIssues([...state.work.services.filter(s=>s.id!==edit.id),edit],'服务').concat(portList(edit.ports).some(p=>p.invalid)?['端口格式应为 80/tcp，多个端口以逗号分隔']:[]);}return [];}
function liveErrors(){return `<div class="ip-errors" data-live-errors role="alert">${liveIssues().map(esc).join('<br>')}</div>`;}
function updateLiveErrors(){const area=root.querySelector?.('[data-live-errors]');if(area)area.innerHTML=liveIssues().map(esc).join('<br>');}
function combination(services,selections){const errors=[],warnings=[],ports=new Map(),active=new Map(),order=[],visiting=new Set(),visited=new Set();
for(const [id,value] of Object.entries(selections)){if(!value)continue;const service=services.find(s=>s.id===id),m=service?.modes.find(m=>m.id===value);if(!m){errors.push((service?.name||'已移除的服务')+'：请选择有效模式');continue;}active.set(id,{service,m});}
for(const {service,m} of active.values()){if(m.strategy==='script'&&!m.files.some(f=>f.role==='启动'))errors.push(service.name+'：缺少启动脚本');const declared=portList(m.ports||service.ports||'');if(!declared.length&&m.strategy!=='manual')warnings.push(service.name+' 未声明监听端口，无法静态确认占用');for(const port of declared){if(port.invalid){errors.push(service.name+'：端口格式无效');continue;}if(ports.has(port.key)&&ports.get(port.key)!==service.id)errors.push(service.name+' 与 '+active.get(ports.get(port.key)).service.name+' 冲突：'+port.key);else ports.set(port.key,service.id);}for(const dep of m.dependsOn||[])if(!active.has(dep))errors.push(service.name+' 缺少依赖：'+(services.find(s=>s.id===dep)?.name||'未知服务'));}
function visit(id,path=[]){if(visiting.has(id)){errors.push('依赖循环：'+[...path,id].map(key=>active.get(key)?.service.name||key).join(' → '));return;}if(visited.has(id))return;visiting.add(id);for(const dep of active.get(id).m.dependsOn||[])if(active.has(dep))visit(dep,[...path,id]);visiting.delete(id);visited.add(id);order.push(id);}
for(const id of active.keys())visit(id);
return {errors:[...new Set(errors)],warnings,order:order.map(id=>active.get(id).service.name)};}
function combinationView(result){return `<div aria-live="polite">${result.errors.length?`<div class="ip-errors" role="alert">${result.errors.map(esc).join('<br>')}</div>`:message('启用组合检查通过'+(result.order.length?' · 启动顺序：'+result.order.join(' → '):' · 不自动启动服务'))}${result.warnings.length?`<div class="ip-notice warn">${result.warnings.map(esc).join('<br>')}</div>`:''}</div>`;}
function templateScope(){return state.runtime==='docker'?'image:'+state.images[state.templateImage].id:'core';}
function templateSelection(){const prefix=templateScope()+':';return Object.fromEntries(Object.entries(state.templateSelections).filter(([key,value])=>key.startsWith(prefix)&&value).map(([key,value])=>[key.slice(prefix.length),value]));}

function changeSummary(){const old=selectedImage().appliedServices||selectedImage().services,current=state.work.services;const oldMap=new Map(old.map(s=>[s.id,s])),nowMap=new Map(current.map(s=>[s.id,s]));let added=0,removed=0,changed=0,modeChanges=0;

root.addEventListener('keydown',event=>{const dialogs=Array.from(root.querySelectorAll('[role="dialog"]')).filter(d=>!d.closest('[inert]'));const dialog=dialogs[dialogs.length-1];if(!dialog)return;if(event.key==='Escape'){event.preventDefault();if(state.child){focusTarget=`[data-act="open-service"][data-id="${state.child.id}"]`;state.child=null;state.modeEditor=null;}else if(state.importOpen){state.importOpen=false;state.importPreview=null;focusTarget='[data-act="open-import"]';}else if(dirty()||state.serviceEditor)state.dialogMessage='还有未提交修改，确认放弃后关闭？';else closeWork();render();persist();}if(event.key==='Tab'){const controls=Array.from(dialog.querySelectorAll('button,input,select,textarea')).filter(el=>!el.disabled&&el.type!=='hidden'&&!el.hidden);const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming){state=restored(incoming);render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addSelect(settings,'sessionCount',{label:'模拟现存 CORE 会话数',options:['0','1','2']});}
})();
